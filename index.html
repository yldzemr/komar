<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOMAR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* SAF BEYAZ FON */
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0 20px;
            -webkit-font-smoothing: antialiased;
        }
        
        /* ÜST ALAN (HEADER) */
        header {
            width: 100%;
            max-width: 1350px;
            padding: 85px 0 45px 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .brand-link {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #111111;
            cursor: pointer;
        }
        
        
        /* LOGO (SVG) */
        .brand-logo {
            display: block;
            height: 60px;
            width: auto;
        }

        /* ANA İÇERİK GÖVDESİ */
        .container {
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* 1. SIRADA: FOTOĞRAF BLOK KUTUSU (İLK DOĞRU AYARIN) */
        .slider-block {
            width: 100%;
            margin-bottom: 90px; 
        }

        .swiper {
            width: 100%;
            max-width: 1350px !important;      
            aspect-ratio: 16 / 9 !important; 
            margin: 0 auto !important;
            background-color: #ffffff !important; 
        }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .swiper-button-next, .swiper-button-prev {
            color: #ffffff !important;
            transform: scale(0.7);
        }
        .swiper-pagination {
            bottom: 20px !important;
        }
        .swiper-pagination-bullet {
            background-color: #ffffff !important;
            opacity: 0.6;
            width: 10px !important;
            height: 10px !important;
            transition: all 0.3s ease;
        }
        .swiper-pagination-bullet-active {
            background-color: #ffffff !important;
            opacity: 1;
            width: 12px !important;
            height: 12px !important;
        }

        /* 2. SIRADA: VİDEO BLOK KUTUSU */
        .video-block {
            width: 100%;
            margin-bottom: 90px !important; 
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 1350px;
            aspect-ratio: 16 / 9 !important; 
            margin: 0 auto !important;
            background-color: #000000 !important;
            background-image: url('https://img.youtube.com/vi/XjPSGuJskxM/maxresdefault.jpg') !important;
            background-size: cover !important; 
            background-repeat: no-repeat !important;
            background-position: center !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            overflow: hidden;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .play-button {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .play-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.1);
        }
        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 15px solid #000000;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            margin-left: 3px;
        }
        
        /* 3. SIRADA: İLETİŞİM ALANI */
        .footer-contact {
            width: 100%;
            text-align: center;
            padding: 20px 0 40px 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }
        .contact-btn {
            display: inline-block;
            padding: 14px 40px;
            border: 1px solid #111111;
            color: #111111;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            transition: all 0.4s ease;
            background-color: transparent;
        }
        .contact-btn:hover {
            background-color: #111111;
            color: #ffffff;
        }
        .social-links {
            display: flex;
            gap: 25px;
        }
        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            color: #111111;
            text-decoration: none;
            transition: all 0.4s ease;
            opacity: 0.6;
        }
        .social-link:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .social-link svg {
            width: 28px;
            height: 28px;
            stroke: #111111;
            fill: none;
            stroke-width: 1.5;
        }
        .social-link:nth-child(2) svg {
            width: 32px;
            height: 32px;
        }

        /* COPYRIGHT ALANI */
        .copyright {
            width: 100%;
            max-width: 1350px;
            margin: 40px auto 0 auto;
            border-top: 1px solid #eeeeee; 
            padding: 75px 20px;               
            text-align: left;
            font-size: 12px;
            color: #111111;
            opacity: 0.5;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* TABLET BREAKPOINT (1024px) */
        @media (max-width: 1024px) {
            .brand-logo {
                height: 48px !important;
            }
            body {
                padding: 0 20px !important;
            }
            header {
                padding: 60px 0 35px 0 !important;
            }
            .slider-block {
                margin-bottom: 90px !important;
            }
            .video-block {
                margin-bottom: 90px !important;
            }
            .footer-contact {
                padding: 50px 0 30px 0 !important;
                gap: 30px !important;
            }
            .copyright {
                padding: 50px 20px !important;
                margin-top: 30px !important;
            }
        }

        /* MOBİL DENGELİ KİLİTLEME ALANI */
        @media (max-width: 768px) {
            .brand-logo {
                height: 40px !important;
            }
            body {
                padding: 0 16px !important;
            }
            header {
                padding: 40px 0 25px 0 !important;
            }
            
            /* Üstteki slider'ın mobil temizliği */
            .slider-block {
                margin-bottom: 90px !important; 
            }
            .swiper {
                aspect-ratio: 16 / 9 !important; 
                width: 100% !important; 
            }
            
            /* Alttaki videonun mobil temizliği */
            .video-block {
                margin-bottom: 100px !important; 
            }
            .video-wrapper {
                aspect-ratio: 16 / 9 !important;
                width: 100% !important;
            }

            .play-button {
                width: 50px !important;
                height: 50px !important;
            }
            
            .footer-contact {
                padding: 60px 0 20px 0 !important; 
                gap: 25px !important;
            }
            .copyright {
                padding: 40px 16px !important;
                margin-top: 20px !important;
                font-size: 11px !important;
            }
        }

        /* KÜÇÜK MOBIL (480px altı - iPhone SE, eski cihazlar) */
        @media (max-width: 480px) {
            .brand-logo {
                height: 40px !important;
            }
            body {
                padding: 0 12px !important;
            }
            header {
                padding: 30px 0 20px 0 !important;
            }
            .slider-block {
                margin-bottom: 85px !important;
            }
            .video-block {
                margin-bottom: 95px !important;
            }
            .footer-contact {
                padding: 55px 0 15px 0 !important;
                gap: 20px !important;
            }
            .copyright {
                padding: 30px 12px !important;
                margin-top: 15px !important;
            }
        }
    </style>
</head>

    <script>
        function playVideo() {
            document.getElementById('videoContainer').innerHTML = 
            '<iframe src="https://www.youtube.com/embed/XjPSGuJskxM?autoplay=1&mute=1" allowfullscreen></iframe>';
        }
        
        new Swiper('.swiper', {
            effect: 'fade',
            speed: 1500, 
            fadeEffect: {
                crossFade: true
            },
            autoplay: {
                delay: 7000, 
                disableOnInteraction: false,
            },
            loop: true,
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
        });
